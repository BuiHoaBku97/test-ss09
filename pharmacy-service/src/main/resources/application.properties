spring.application.name=pharmacy-service
server.port=8081

# Spring Data JPA configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mc09_pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=secretkey

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.config.import=optional:configserver:

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

app.brand-name=Pharmacy Service No.1
app.hotline=19001901