server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/mc09_pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=secretkey

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.refresh.enable=false

app.brand-name=Pharmacy Service No.1
app.hotline=19001904
pharmacy.vat-rate=0.1

management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers,circuitbreakerevents,retryevents,ratelimiterevents,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

warehouse.service-url=http://warehouse-service

resilience4j.circuitbreaker.instances.warehouseCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-size=4
resilience4j.circuitbreaker.instances.warehouseCB.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s

resilience4j.retry.instances.invoiceRetry.max-attempts=4
resilience4j.retry.instances.invoiceRetry.wait-duration=2s
resilience4j.retry.instances.invoiceRetry.enable-exponential-backoff=false
resilience4j.retry.instances.invoiceRetry.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.retry.retry-aspect-order=2

resilience4j.ratelimiter.instances.invoiceRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.invoiceRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.invoiceRateLimiter.timeout-duration=0s
resilience4j.ratelimiter.rate-limiter-aspect-order=1
