server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/mc09_pharmacy_db
spring.datasource.username=postgres
spring.datasource.password=secretkey

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.refresh.enable=false

app.brand-name=Pharmacy Service No.1
app.hotline=19001903
pharmacy.vat-rate=0.1

management.endpoints.web.exposure.include=health,info,refresh
